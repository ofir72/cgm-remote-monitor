# curl https://cgm.nophir.com --resolve 'cgm.nophir.com"80:192.168.31.6'

# curl  http://cgm.nophir.com/.well-known/acme-challenge/OiRyVSCLgzWbGZlt9iaCB1mZoXXxJdFb9KpgpD8rV0E 

x-logging:
  &default-logging
  options:
    max-size: '10m'
    max-file: '5'
  driver: json-file

services:
  mongo:
    image: mongo:4.4
    restart: always
    volumes:
      - ${NS_MONGO_DATA_DIR:-./mongo-data}:/data/db:cached
    logging: *default-logging

  nightscout:
    image: nightscout/cgm-remote-monitor:latest
    container_name: nightscout
    restart: always
    depends_on:
      - mongo
    ports:
     - "1337:1337"
    labels:
      - 'traefik.enable=true'
      # Change the below Host from `localhost` to be the web address where Nightscout is running.
      # Also change the email address in the `traefik` service below.
      - 'traefik.http.routers.nightscout.rule=Host(`cgm.nophir.com`)'
      - 'traefik.http.routers.nightscout.entrypoints=websecure'
      - 'traefik.http.routers.nightscout.tls.certresolver=le'
    logging: *default-logging
    environment:
      ### Variables for the container
      NODE_ENV: production
      TZ: Etc/UTC
      BRIDGE_USER_NAME: danitdex 
      BRIDGE_PASSWORD: ofir5902
      BRIDGE_SERVER: EU

      ### Overridden variables for Docker Compose setup
      # The `nightscout` service can use HTTP, because we use `traefik` to serve the HTTPS
      # and manage TLS certificates
      INSECURE_USE_HTTP: 'true'

      # For all other settings, please refer to the Environment section of the README
      ### Required variables
      # MONGO_CONNECTION - The connection string for your Mongo database.
      # Something like mongodb://sally:sallypass@ds099999.mongolab.com:99999/nightscout
      # The default connects to the `mongo` included in this docker-compose file.
      # If you change it, you probably also want to comment out the entire `mongo` service block
      # and `depends_on` block above.
      MONGO_CONNECTION: mongodb://mongo:27017/nightscout

      # API_SECRET - A secret passphrase that must be at least 12 characters long.
      API_SECRET: ofir5902ofir5902

      ### Features
      # ENABLE - Used to enable optional features, expects a space delimited list, such as: careportal rawbg iob
      # See https://github.com/nightscout/cgm-remote-monitor#plugins for details
      ENABLE: careportal bridge iob cob cage sage connect pump override openaps profile
      SHOW_FORECAST: openaps 
      SHOW_PLUGINS: openaps pump iob sage cage careportal
      THEME: colorblindfriendly 
      DISPLAY_UNITS: "mg/dl"
      BG_HIGH: "260"
      BG_TARGET_TOP: "180"
      BG_TARGET_BOTTOM: "80"
      BG_LOW: "55"
      BASAL_RENDER: "default"
      BOLUS_RENDER_FORMAT: "minimal"
      BOLUS_RENDER_FORMAT_SMALL: "default"
      BOLUS_RENDER_OVER: "0.1"
      DBSIZE_MAX: "20000"
      DEVICESTATUS_ADVANCED: "true"
      SCALE_Y: log
      OPENAPS_COLOR_PREDICTION_LINES: true 




      # AUTH_DEFAULT_ROLES (readable) - possible values readable, denied, or any valid role name.
      # When readable, anyone can view Nightscout without a token. Setting it to denied will require
      # a token from every visit, using status-only will enable api-secret based login.
      AUTH_DEFAULT_ROLES: denied

      # For all other settings, please refer to the Environment section of the README
      # https://github.com/nightscout/cgm-remote-monitor#environment

  traefik:
    image: traefik:latest
    container_name: 'traefik'
    restart: always
    command:
      - "--log.level=DEBUG"
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      - '--entrypoints.websecure.address=:443'
      # - "--certificatesresolvers.le.acme.httpchallenge=true"
      # - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - '--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json'
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      # Change the below to match your email address
      - '--certificatesresolvers.le.acme.email=ofir@nophir.com'
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - './letsencrypt:/letsencrypt'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    logging: *default-logging


